<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투자자산운용사 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#1A2332; --muted:#5C6677; --line:#DCE1E8;
  --bad:#BF3328; --good:#1D6B58; --accent:#2B4C9E; --accent-soft:#E5EBF7; --chip:#ECEFF4;
  --display:"Noto Serif KR", Georgia, serif;
  --body:"IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#19202A; --ink:#E6EAF1; --muted:#9AA3B3; --line:#2A3240;
    --bad:#F07A6E; --good:#5CC6A6; --accent:#91AAEE; --accent-soft:#222C42; --chip:#222935;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#19202A; --ink:#E6EAF1; --muted:#9AA3B3; --line:#2A3240;
  --bad:#F07A6E; --good:#5CC6A6; --accent:#91AAEE; --accent-soft:#222C42; --chip:#222935;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;word-break:keep-all}
.wrap{max-width:860px;margin:0 auto;padding:32px 16px 80px;display:grid;gap:20px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,5vw,36px);line-height:1.2;margin:0}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch}
a{color:var(--accent)}
.note{background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-family:var(--mono);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 200px;width:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:500 15px var(--body);color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
textarea{min-height:220px;resize:vertical;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:8px 14px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 13px var(--body);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.card h3{margin:0;font-size:17px;font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:11px;background:var(--chip);padding:2px 8px;border-radius:4px;color:var(--muted)}
.status{appearance:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font:500 12px var(--body);cursor:pointer;background:var(--surface);color:var(--ink)}
.status.mastered{color:var(--good);border-color:var(--good)}
.status.new{color:var(--bad)}
.link{appearance:none;background:none;border:0;color:var(--muted);font:12.5px var(--body);cursor:pointer;padding:2px 4px}
.link.armed{color:var(--bad);font-weight:600}
.md{overflow-wrap:anywhere;min-width:0}
.md h1,.md h2,.md h3,.md h4{font-family:var(--body);font-weight:600;line-height:1.35;margin:1.1em 0 .4em}
.md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15.5px}.md h4{font-size:15px}
.md > :first-child{margin-top:0}
.md p,.md ul,.md ol{margin:.5em 0}
.md blockquote{margin:.6em 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0}
.md code{font-family:var(--mono);font-size:.9em;background:var(--chip);padding:1px 5px;border-radius:4px}
.md pre{overflow-x:auto;background:var(--chip);padding:10px;border-radius:6px}
.md pre code{background:none;padding:0}
.md .tbl{overflow-x:auto}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--chip)}
.md details{background:var(--chip);border-radius:6px;padding:6px 10px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.review{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px}
.review .q{font-family:var(--display);font-size:22px;line-height:1.35}
.reps{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:600px){.row3{grid-template-columns:1fr}.stat b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">Study notes · GitHub sync</div>
    <h1>투자자산운용사 노트</h1>
    <p class="lede">개념 정리 노트를 GitHub 비공개 저장소에 저장합니다. Claude도 같은 파일을 읽고 쓸 수 있어요. 복습 탭에서 3번 연속 "알았음"이면 완벽으로 표시됩니다. <a href="viz-insurance.html">보험자산배분 시각화 →</a> · <a href="./">영어 노트로 →</a></p>
  </header>

  <div id="notice" class="note" hidden></div>

  <div class="filters">
    <button class="btn primary" id="newBtn" type="button">+ 새 노트</button>
    <button class="btn" id="refreshBtn" type="button">새로고침</button>
    <button class="btn" id="exportBtn" type="button">백업 내보내기</button>
    <button class="btn" id="settingsBtn" type="button">설정</button>
  </div>

  <form id="settingsForm" class="panel" hidden>
    <div class="label">GitHub 연결 (이 브라우저에만 저장, 영어 노트와 공유)</div>
    <div class="row3">
      <label class="f">GitHub 사용자명<input id="sOwner" autocomplete="off"></label>
      <label class="f">저장소<input id="sRepo" placeholder="english-notebook-data" autocomplete="off"></label>
      <label class="f">파일<input id="sFile" placeholder="invest-notes.json" autocomplete="off"></label>
    </div>
    <label class="f">Access token (fine-grained, Contents: read and write)<input id="sToken" type="password" autocomplete="off"></label>
    <div><button class="btn primary" type="submit">저장하고 연결</button></div>
  </form>

  <form id="editForm" class="panel" hidden>
    <div class="label" id="editLabel">새 노트</div>
    <label class="f">제목<input id="fTitle" required placeholder="전략적 자산배분의 실행방법"></label>
    <div class="row3">
      <label class="f">과목<select id="fSubject"></select></label>
      <label class="f">세부 단원<input id="fTopic" placeholder="분산투자기법"></label>
      <label class="f">태그 (쉼표로 구분)<input id="fTags" placeholder="암기, O/X, 계산"></label>
    </div>
    <label class="f">내용 (마크다운: # 제목, - 목록, **굵게**, | 표 |)
      <textarea id="fBody" placeholder="## 핵심&#10;- ...&#10;&#10;## 함정 O/X&#10;- ..."></textarea></label>
    <div class="filters" style="justify-content:flex-end">
      <button class="btn" type="button" id="cancelBtn">취소</button>
      <button class="btn primary" type="submit">저장</button>
    </div>
  </form>

  <section class="stats" aria-label="진행 상황">
    <div class="stat"><span class="label">노트</span><b id="sTotal">0</b></div>
    <div class="stat"><span class="label">복습 필요</span><b id="sOpen">0</b></div>
    <div class="stat"><span class="label">완벽</span><b id="sDone">0</b></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabList" aria-selected="true">노트</button>
    <button class="tab" role="tab" id="tabReview" aria-selected="false">복습</button>
  </nav>

  <section id="viewList" style="display:grid;gap:14px">
    <div class="filters" id="subjFilters"></div>
    <div class="filters">
      <select id="statusFilter" aria-label="상태 필터" style="width:auto">
        <option value="all">모든 상태</option>
        <option value="new">처음</option>
        <option value="learning">복습 중</option>
        <option value="mastered">완벽</option>
      </select>
      <input class="grow" id="search" type="search" placeholder="제목, 내용, 태그 검색">
    </div>
    <div class="list" id="list"></div>
  </section>

  <section id="viewReview" hidden></section>
</div>

<script>
const SUBJECTS = {
  s1: "1과목 · 금융상품 및 세제",
  s2: "2과목 · 투자분석 · 리스크 · 대안/해외",
  s3: "3과목 · 윤리 · 법규 · 운용전략",
  etc: "기타"
};
const STATUS = { new: "처음", learning: "복습 중", mastered: "완벽" };
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
}
function md(text) {
  const box = el("div", { class: "md" });
  if (window.marked && window.DOMPurify) {
    box.innerHTML = DOMPurify.sanitize(marked.parse(text || "", { gfm: true, breaks: true }));
    box.querySelectorAll("table").forEach(t => { const w = el("div", { class: "tbl" }); t.replaceWith(w); w.append(t); });
  } else { box.style.whiteSpace = "pre-wrap"; box.textContent = text || ""; }
  return box;
}
function notice(msg) { $("notice").textContent = msg; $("notice").hidden = !msg; }

let items = [], canWrite = false, subj = "all", editingId = null;
const open = new Set();

// ---- GitHub storage (same token as the English notebook on this site) ----
const CFG_KEY = "english-notebook-github", FILE_KEY = "invest-notebook-file";
let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || "{}"); } catch {}
let file = "invest-notes.json"; try { file = localStorage.getItem(FILE_KEY) || file; } catch {}
(function guess() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (m) cfg = { owner: m[1], repo: "english-notebook-data", ...cfg };
})();
let sha = null, saving = Promise.resolve();
const api = () => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${file}`;
const headers = () => ({ Accept: "application/vnd.github+json", ...(cfg.token ? { Authorization: "Bearer " + cfg.token } : {}) });
function b64encode(s) {
  const bytes = new TextEncoder().encode(s); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(s) { return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0))); }
const sortItems = () => items.sort((a, b) => (b.updatedAt || b.createdAt || "").localeCompare(a.updatedAt || a.createdAt || ""));

async function pull() {
  if (!cfg.owner || !cfg.repo) { notice("설정에서 GitHub 저장소를 입력하세요."); render(); return; }
  try {
    const r = await fetch(api() + "?t=" + Date.now(), { headers: headers(), cache: "no-store" });
    if (r.status === 404) { items = []; sha = null; canWrite = !!cfg.token; notice(cfg.token ? `${file}이(가) 아직 없어요. 첫 노트를 저장하면 만들어집니다.` : "노트를 찾지 못했어요. 비공개 저장소라면 설정에서 토큰을 입력하세요."); render(); return; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json(); sha = j.sha;
    const text = j.content ? b64decode(j.content)
      : await (await fetch(api() + "?t=" + Date.now(), { headers: { ...headers(), Accept: "application/vnd.github.raw+json" }, cache: "no-store" })).text();
    items = JSON.parse(text); sortItems();
    canWrite = !!cfg.token;
    notice(cfg.token ? "" : "읽기 전용: 저장하려면 설정에서 토큰을 입력하세요.");
    render();
  } catch { notice("GitHub에 연결하지 못했어요. 인터넷 연결과 설정의 저장소 이름을 확인하세요."); render(); }
}
function push(message) {
  saving = saving.then(async () => {
    if (!cfg.token) { notice("저장하려면 설정에서 토큰을 입력하세요."); return; }
    sortItems(); render();
    const body = { message, content: b64encode(JSON.stringify(items, null, 2) + "\n"), ...(sha ? { sha } : {}) };
    const r = await fetch(api(), { method: "PUT", headers: { ...headers(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.ok) { sha = (await r.json()).content.sha; notice(""); return; }
    if (r.status === 409 || r.status === 422) { notice("다른 곳(예: Claude)에서 노트가 바뀌었어요. 최신 버전을 불러왔으니 마지막 변경을 다시 해주세요."); await pull(); return; }
    notice("GitHub 저장 실패 (오류 " + r.status + "). 설정의 토큰을 확인하세요.");
  });
  return saving;
}
const save = (id, patch) => { const i = items.find(x => x.id === id); if (i) Object.assign(i, patch); return push("Update note " + id); };
const remove = id => { items = items.filter(x => x.id !== id); return push("Delete note " + id); };

// ---- editor ----
for (const [k, v] of Object.entries(SUBJECTS)) $("fSubject").append(el("option", { value: k }, v));
function openEditor(note) {
  if (!canWrite) { notice("저장하려면 설정에서 토큰을 입력하세요."); $("settingsForm").hidden = false; return; }
  editingId = note ? note.id : null;
  $("editLabel").textContent = note ? "노트 수정" : "새 노트";
  $("fTitle").value = note?.title || "";
  $("fSubject").value = note?.subject || (subj !== "all" ? subj : "s3");
  $("fTopic").value = note?.topic || "";
  $("fTags").value = (note?.tags || []).join(", ");
  $("fBody").value = note?.body || "";
  $("editForm").hidden = false; $("fTitle").focus();
  $("editForm").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("newBtn").onclick = () => openEditor(null);
$("cancelBtn").onclick = () => { $("editForm").hidden = true; editingId = null; };
$("editForm").addEventListener("submit", async e => {
  e.preventDefault();
  const data = {
    title: $("fTitle").value.trim(), subject: $("fSubject").value, topic: $("fTopic").value.trim(),
    tags: $("fTags").value.split(",").map(s => s.trim()).filter(Boolean), body: $("fBody").value,
    updatedAt: new Date().toISOString()
  };
  if (!data.title) return;
  $("editForm").hidden = true;
  if (editingId) { open.add(editingId); await save(editingId, data); }
  else {
    const id = "n" + Date.now().toString(36);
    items.push({ id, ...data, status: "new", reps: 0, createdAt: data.updatedAt });
    open.add(id); await push("Add note: " + data.title);
  }
  editingId = null;
});

// ---- list ----
function renderFilters() {
  const box = $("subjFilters"); box.replaceChildren();
  const count = k => items.filter(i => k === "all" || i.subject === k).length;
  for (const k of ["all", ...Object.keys(SUBJECTS)]) {
    const n = count(k); if (k !== "all" && !n) continue;
    box.append(el("button", { class: "chip", type: "button", "aria-pressed": String(subj === k), onclick: () => { subj = k; render(); } },
      (k === "all" ? "전체" : SUBJECTS[k].split(" · ")[0]) + ` ${n}`));
  }
}
function card(n) {
  const isOpen = open.has(n.id);
  const del = el("button", { class: "link", type: "button" }, "삭제");
  del.onclick = () => {
    if (!canWrite) return;
    if (del.classList.contains("armed")) remove(n.id);
    else { del.classList.add("armed"); del.textContent = "정말 삭제?"; setTimeout(() => { del.classList.remove("armed"); del.textContent = "삭제"; }, 3000); }
  };
  const nextStatus = { new: "learning", learning: "mastered", mastered: "new" };
  return el("article", { class: "card" },
    el("h3", { onclick: () => { isOpen ? open.delete(n.id) : open.add(n.id); renderList(); } }, (isOpen ? "▾ " : "▸ ") + n.title),
    el("div", { class: "meta" },
      el("span", {}, SUBJECTS[n.subject]?.split(" · ")[0] || "기타"),
      n.topic ? el("span", {}, "· " + n.topic) : null,
      ...(n.tags || []).map(t => el("span", { class: "tag" }, t)),
      el("button", { class: "status " + n.status, type: "button", title: "상태 바꾸기",
        onclick: () => canWrite && save(n.id, { status: nextStatus[n.status] || "new", reps: 0 }) }, STATUS[n.status] || n.status),
      canWrite ? el("button", { class: "link", type: "button", onclick: () => openEditor(n) }, "수정") : null,
      canWrite ? del : null),
    isOpen ? md(n.body) : null);
}
function renderList() {
  const q = $("search").value.trim().toLowerCase(), st = $("statusFilter").value;
  const shown = items.filter(n => (subj === "all" || n.subject === subj) && (st === "all" || n.status === st) &&
    (!q || [n.title, n.topic, n.body, ...(n.tags || [])].join(" ").toLowerCase().includes(q)));
  const list = $("list"); list.replaceChildren(...shown.map(card));
  if (!shown.length) list.append(el("p", { class: "empty" }, items.length ? "조건에 맞는 노트가 없어요." : "아직 노트가 없어요. ‘+ 새 노트’로 시작하세요."));
}
function render() {
  $("sTotal").textContent = items.length;
  $("sOpen").textContent = items.filter(i => i.status !== "mastered").length;
  $("sDone").textContent = items.filter(i => i.status === "mastered").length;
  renderFilters(); renderList(); if (!$("viewReview").hidden) renderReview();
}
$("search").oninput = renderList; $("statusFilter").onchange = renderList;

// ---- review ----
let current = null, revealed = false;
function pickNext() {
  const pool = items.filter(i => i.status !== "mastered" && (subj === "all" || i.subject === subj));
  const others = pool.filter(i => i.id !== current?.id);
  const from = others.length ? others : pool;
  current = from.length ? from[Math.floor(Math.random() * from.length)] : null; revealed = false;
}
function renderReview() {
  const box = $("viewReview"); box.replaceChildren();
  if (!current || current.status === "mastered" || !items.includes(current)) pickNext();
  if (!current) { box.append(el("p", { class: "empty" }, "복습할 노트가 없어요. 모두 완벽이거나 아직 노트가 없습니다.")); return; }
  const c = current;
  const wrap = el("div", { class: "review" },
    el("div", { class: "meta" }, SUBJECTS[c.subject]?.split(" · ")[0] || "", c.topic ? "· " + c.topic : ""),
    el("div", { class: "q" }, c.title),
    el("div", { class: "reps" }, `연속 정답 ${c.reps || 0}/3`),
    revealed ? md(c.body) : el("p", { style: "color:var(--muted);margin:0" }, "머릿속으로 핵심을 떠올린 뒤 내용을 열어보세요."));
  const actions = el("div", { class: "filters" });
  if (!revealed) actions.append(el("button", { class: "btn primary", type: "button", onclick: () => { revealed = true; renderReview(); } }, "내용 보기"));
  else {
    actions.append(
      el("button", { class: "btn primary", type: "button", onclick: async () => {
        const reps = (c.reps || 0) + 1; pickNext();
        await save(c.id, { reps, status: reps >= 3 ? "mastered" : "learning" });
      } }, "알았음"),
      el("button", { class: "btn", type: "button", onclick: async () => { pickNext(); await save(c.id, { reps: 0, status: "learning" }); } }, "몰랐음"));
  }
  actions.append(el("button", { class: "link", type: "button", onclick: () => { pickNext(); renderReview(); } }, "건너뛰기"));
  wrap.append(actions); box.append(wrap);
}
function tab(which) {
  $("tabList").setAttribute("aria-selected", String(which === "list"));
  $("tabReview").setAttribute("aria-selected", String(which === "review"));
  $("viewList").hidden = which !== "list"; $("viewReview").hidden = which !== "review";
  if (which === "review") renderReview();
}
$("tabList").onclick = () => tab("list"); $("tabReview").onclick = () => tab("review");

// ---- settings / misc ----
$("settingsBtn").onclick = () => {
  $("sOwner").value = cfg.owner || ""; $("sRepo").value = cfg.repo || ""; $("sToken").value = cfg.token || ""; $("sFile").value = file;
  $("settingsForm").hidden = !$("settingsForm").hidden;
};
$("settingsForm").addEventListener("submit", e => {
  e.preventDefault();
  cfg = { owner: $("sOwner").value.trim(), repo: $("sRepo").value.trim(), token: $("sToken").value.trim() };
  file = $("sFile").value.trim() || "invest-notes.json";
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); localStorage.setItem(FILE_KEY, file); } catch {}
  $("settingsForm").hidden = true; pull();
});
$("refreshBtn").onclick = pull;
$("exportBtn").onclick = () => {
  const a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify(items, null, 2)], { type: "application/json" })), download: "invest-notes-backup.json" });
  document.body.append(a); a.click(); a.remove();
};
pull();
</script>
